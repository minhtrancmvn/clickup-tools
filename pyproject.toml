[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clickup-tools"
version = "0.1.0"
description = "Small command-line tools for ClickUp workflows."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "ClickUp Tools Maintainers" }
]
classifiers = [
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
  "mcp>=1.0",
]

[project.scripts]
clickup-update-page = "clickup_tools.update_page:main"
clickup-update-task = "clickup_tools.update_task:main"
clickup-mcp-server  = "clickup_tools.mcp_server:run_server"

[tool.setuptools.packages.find]
where = ["src"]
